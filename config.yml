#######################################
# DouYinCommand.py / downloader.py 完整配置样例
#######################################

link:
  - https://www.douyin.com/user/SEC_USER_ID
  # - https://v.douyin.com/EXAMPLE/

path: ./Downloaded/
thread: 5

mode:
  - post

number:
  post: 0
  like: 0
  music: 0
  mix: 0
  allmix: 0

increase:
  post: false
  like: false
  music: false
  mix: false
  allmix: false

music: true
cover: true
avatar: true
json: true
database: true
folderstyle: true

start_time: ''
end_time: ''

# 视频切帧（可选）
# slice_videos: true
# slice_fps: 10
# slice_subdir: frames
# slice_backfill_on_run: false
# auto_install_ffmpeg: true
# ffmpeg_bin: ffmpeg

# Cookie 两种写法
# 1) 使用 Cookie 字典
cookies:
  msToken: YOUR_MS_TOKEN
  ttwid: YOUR_TTWID
  odin_tt: YOUR_ODIN_TT
  passport_csrf_token: YOUR_PASSPORT_CSRF_TOKEN
  sid_guard: YOUR_SID_GUARD

# 2) 使用 Cookie 字符串（与字典二选一）
# cookie: "msToken=YOUR_MS_TOKEN; ttwid=YOUR_TTWID; odin_tt=YOUR_ODIN_TT; ..."
